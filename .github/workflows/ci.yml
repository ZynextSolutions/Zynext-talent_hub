name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cor_lms
          POSTGRES_PASSWORD: cor_lms_secret
          POSTGRES_DB: cor_lms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cor_lms -d cor_lms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://cor_lms:cor_lms_secret@localhost:5432/cor_lms?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-minimum-32-chars-long
      JWT_REFRESH_SECRET: ci-refresh-secret-minimum-32-chars-long
      JWT_ISS: cor-lms
      JWT_AUD: cor-lms-api
      CORS_ORIGINS: http://localhost:3000
      API_PUBLIC_URL: http://localhost:4000
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_WEB_URL: http://localhost:3000
      ALLOW_PUBLIC_ORG_REGISTER: "true"
      REDIS_URL: redis://localhost:6379
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Migrate database
        run: npx prisma migrate deploy

      - name: Build backend
        run: npm run build --prefix backend

      - name: Lint frontend
        run: npm run lint --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Audit
        run: |
          npm audit --audit-level=high
          npm audit --prefix backend --audit-level=high

      - name: Seed database
        run: npm run db:seed

      - name: Start API
        run: npm run start --prefix backend &

      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health; then
              exit 0
            fi
            sleep 2
          done
          echo "API failed to become healthy"
          exit 1

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration
