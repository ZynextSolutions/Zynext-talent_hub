name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cor_lms
          POSTGRES_PASSWORD: cor_lms_secret
          POSTGRES_DB: cor_lms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cor_lms -d cor_lms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://cor_lms:cor_lms_secret@localhost:5432/cor_lms?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-minimum-32-chars-long
      JWT_REFRESH_SECRET: ci-refresh-secret-minimum-32-chars-long
      JWT_ISS: cor-lms
      JWT_AUD: cor-lms-api
      CORS_ORIGINS: http://localhost:3000
      API_PUBLIC_URL: http://localhost:4000
      PUBLIC_WEB_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_WEB_URL: http://localhost:3000
      API_PROXY_TARGET: http://127.0.0.1:4000
      ALLOW_PUBLIC_ORG_REGISTER: "true"
      ALLOW_QUERY_ACCESS_TOKEN: "false"
      REDIS_URL: redis://localhost:6379
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      JOB_SECRET: ci-job-secret-minimum-16
      BCRYPT_ROUNDS: "12"
      # Keep IPv4 bind in CI so health waits against 127.0.0.1 stay reliable.
      LISTEN_HOST: "0.0.0.0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Migrate database
        run: npx prisma migrate deploy

      - name: Build backend
        run: npm run build --prefix backend

      - name: Lint frontend
        run: npm run lint --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Audit
        run: |
          npm audit --audit-level=high
          npm audit --prefix backend --audit-level=high
          npm audit --prefix frontend --audit-level=high

      - name: Seed database
        run: npm run db:seed

      - name: Start API (production boot path)
        run: |
          node backend/boot.cjs > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid

      - name: Wait for API
        run: |
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:4000/ready; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to become ready"
          echo "---- api.log ----"
          cat /tmp/api.log || true
          exit 1

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: API health smoke
        run: |
          curl -sf http://127.0.0.1:4000/health
          curl -sf http://127.0.0.1:4000/ready
          echo "API_PROXY_TARGET=${API_PROXY_TARGET}"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: cor-lms-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: cor-lms-web:ci
          build-args: |
            NEXT_PUBLIC_WEB_URL=http://localhost:3000
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
