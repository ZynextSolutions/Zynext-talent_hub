services:
  postgres:
    image: postgres:16-alpine
    container_name: cor_lms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cor_lms
      POSTGRES_PASSWORD: cor_lms_secret
      POSTGRES_DB: cor_lms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cor_lms -d cor_lms"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cor_lms_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
